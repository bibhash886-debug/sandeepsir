<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Sandeep Sir | Social Profile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
      color: #f9fafb;
      background:
        radial-gradient(circle at 15% 10%, rgba(99,102,241,.28), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(236,72,153,.22), transparent 32%),
        #0b1020;
    }
    .card {
      width: min(100%, 420px);
      padding: 30px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 26px;
      background: rgba(17,24,39,.86);
      box-shadow: 0 24px 70px rgba(0,0,0,.38);
      backdrop-filter: blur(12px);
    }
    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 38px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      border: 3px solid rgba(255,255,255,.7);
    }
    h1 { margin: 0; font-size: 28px; }
    .subtitle { margin: 9px 0 24px; color: #cbd5e1; line-height: 1.6; }
    .links { display: grid; gap: 12px; }
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 13px 16px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-size: 16px;
      font-weight: 700;
      transition: transform .15s ease, filter .15s ease;
    }
    .link:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .instagram { background: linear-gradient(100deg, #833ab4, #fd1d1d, #fcb045); }
    .facebook { background: #1877f2; }
    .note { margin: 22px 0 0; font-size: 12px; color: #94a3b8; line-height: 1.5; }
    footer { margin-top: 18px; color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">SS</div>
    <h1>Sandeep Sir</h1>
    <p class="subtitle">मेरे सभी सोशल मीडिया अकाउंट<br>एक ही जगह पर</p>

    <div class="links">
      <a class="link instagram"
         href="https://www.instagram.com/sandeepsir_1?vrfl=Mm50bms0ZHNtZ21x"
         target="_blank" rel="noopener noreferrer">📸 Instagram Profile</a>

      <a class="link facebook"
         href="https://www.facebook.com/share/19WJFBY47x/"
         target="_blank" rel="noopener noreferrer">👍 Facebook Profile 1</a>

      <a class="link facebook"
         href="https://www.facebook.com/share/1cUCzMDNoT/"
         target="_blank" rel="noopener noreferrer">👍 Facebook Profile 2</a>
    </div>

    <p class="note">किसी भी बटन पर टैप करके संबंधित सोशल मीडिया लिंक खोलें।</p>
    <footer>© Sandeep Sir</footer>
  </main>
</body>
</html>
